x-voxly-env: &voxly-env
  VOXLY_MODE: "scale"
  TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
  DATABASE_URL: "postgres://voxly_user:voxly_password@postgres:5432/voxly?sslmode=disable"
  RABBITMQ_URL: "amqp://voxly:voxly_password@rabbitmq:5672/"
  REDIS_ADDR: "redis:6379"
  STT_PROVIDER: "${STT_PROVIDER:-yandex}"
  STT_LANGUAGE: "${STT_LANGUAGE:-ru-RU}"
  YANDEX_API_KEY: "${YANDEX_API_KEY:-}"
  YANDEX_FOLDER_ID: "${YANDEX_FOLDER_ID:-}"
  OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
  GROQ_API_KEY: "${GROQ_API_KEY:-}"
  DEEPGRAM_API_KEY: "${DEEPGRAM_API_KEY:-}"
  S3_ENDPOINT: "${S3_ENDPOINT:-}"
  S3_ACCESS_KEY: "${S3_ACCESS_KEY:-}"
  S3_SECRET_KEY: "${S3_SECRET_KEY:-}"
  S3_BUCKET: "${S3_BUCKET:-voxly-audio}"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"

services:
  postgres:
    image: postgres:15-alpine
    container_name: voxly-postgres
    environment:
      POSTGRES_DB: voxly
      POSTGRES_USER: voxly_user
      POSTGRES_PASSWORD: voxly_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voxly_user -d voxly"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - voxly-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: voxly-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: voxly
      RABBITMQ_DEFAULT_PASS: voxly_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - voxly-network

  redis:
    image: redis:7-alpine
    container_name: voxly-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - voxly-network

  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: voxly-bot
    environment:
      <<: *voxly-env
      VOXLY_ROLE: "bot"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - voxly-network

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: voxly-worker
    environment:
      <<: *voxly-env
      VOXLY_ROLE: "worker"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - voxly-network

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:

networks:
  voxly-network:
    driver: bridge
