# Voxly configuration.
#
# Secrets (tokens, API keys, connection strings) come from the environment —
# see .env.example. This file holds non-sensitive structural defaults and can
# be committed. Every value here is overridden by its matching env var.
#
# Infra drivers (queue/cache/database) are derived from `mode` unless set
# explicitly: lite -> in-memory/sqlite, scale -> rabbitmq/redis/postgres.

mode: scale # lite | scale
role: all # all | bot | worker (scale only, lite always runs all)

stt:
  provider: yandex # yandex | openai | groq | deepgram | whisper
  language: ru-RU

worker:
  concurrency: 4

access:
  mode: open # open | allowlist
  # allowed_user_ids: [111, 222]
  # allowed_chat_ids: [-1001234567890]
  # admin_ids: [111]
  # user_daily_limit: 0 # per user daily cap, 0 = unlimited

observability:
  log_level: info # debug | info | warn | error
  log_format: json # json | console
  metrics_addr: ":9090"
